name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-java@v4

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Apply permissions, icons, splash
        run: python3 scripts/prepare-android.py

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect debug APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/MyTracker-debug.apk

      - name: Build signed release APK
        if: env.KEYSTORE_B64 != ''
        run: |
          cd android && ./gradlew assembleRelease --no-daemon && cd ..
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$ANDROID_HOME/build-tools/$BT/zipalign" -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out out/MyTracker-release.apk "$RUNNER_TEMP/aligned.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTracker-apk
          path: out/*.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
