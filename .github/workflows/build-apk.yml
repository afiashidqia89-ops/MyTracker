name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'package.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Print project state (for diagnostics)
        run: |
          set +e
          set +o pipefail
          echo "=== package.json ==="
          cat package.json
          echo ""
          echo "=== node_modules/@capacitor/* (installed plugins) ==="
          ls -la node_modules/@capacitor/ 2>/dev/null || echo "✗ @capacitor/* tidak terinstall"
          echo ""
          echo "=== android/app/build.gradle ==="
          if [ -f android/app/build.gradle ]; then cat android/app/build.gradle; else echo "✗ android/app/build.gradle tidak ada"; fi
          echo ""
          echo "=== android/settings.gradle ==="
          if [ -f android/settings.gradle ]; then cat android/settings.gradle; else echo "✗ android/settings.gradle tidak ada"; fi
          echo ""
          echo "=== Check android/gradlew exists? ==="
          if [ -f android/gradlew ]; then
            echo "✓ android/gradlew exists"
            ls -la android/gradlew
          else
            echo "✗ android/gradlew TIDAK ADA — akan dibuat di step selanjutnya"
          fi
          echo ""
          echo "=== Check node_modules/@capacitor/* exist? ==="
          for p in android app core geolocation haptics status-bar filesystem share; do
            if [ -d "node_modules/@capacitor/$p/android" ]; then
              echo "✓ @capacitor/$p/android: exists"
            else
              echo "✗ @capacitor/$p/android: TIDAK ADA"
            fi
          done
          echo ""
          echo "=== Project state printed successfully ==="
          exit 0

      - name: Verify app/build.gradle uses subproject references
        working-directory: android
        run: |
          if grep -E "implementation\s+'com\.getcapacitor:" app/build.gradle; then
            echo "❌ ERROR: app/build.gradle masih memakai Maven coordinates (com.getcapacitor:...)"
            echo "   Salin file android/app/build.gradle dari zip terbaru, lalu push ulang."
            exit 1
          else
            echo "✓ app/build.gradle sudah benar (menggunakan project(':capacitor-*'))"
          fi

      - name: Sync web assets to native project
        run: npx cap sync android

      - name: Verify Capacitor sync output
        working-directory: android
        run: |
          if [ -d app/src/main/assets ]; then
            echo "=== Contents of android/app/src/main/assets/ ==="
            ls -la app/src/main/assets/
            echo ""
            echo "=== Contents of assets/public/ (web app) ==="
            ls -la app/src/main/assets/public/ 2>/dev/null | head -20 || echo "✗ public/ folder tidak ada"
          else
            echo "✗ Folder assets/ tidak ada — npx cap sync GAGAL."
            exit 1
          fi

      - name: Ensure gradlew script exists (auto-create if missing)
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            echo "⚠ gradlew script tidak ada — auto-create..."
            cat > gradlew << 'GRADLEW_EOF'
          #!/usr/bin/env bash
          set -e
          APP_HOME=$(cd "$(dirname "$0")" && pwd)
          WRAPPER_JAR="$APP_HOME/gradle/wrapper/gradle-wrapper.jar"
          WRAPPER_PROPS="$APP_HOME/gradle/wrapper/gradle-wrapper.properties"
          GRADLE_VERSION="8.7"
          GRADLE_DIST_URL="https://services.gradle.org/distributions/gradle-\${GRADLE_VERSION}-bin.zip"
          if [ ! -f "\$WRAPPER_JAR" ]; then
            echo "gradle-wrapper.jar missing, downloading..."
            mkdir -p "\$APP_HOME/gradle/wrapper"
            curl -fsSL -o "\$WRAPPER_JAR" "https://raw.githubusercontent.com/gradle/gradle/v\${GRADLE_VERSION}/gradle/wrapper/gradle-wrapper.jar"
          fi
          if [ ! -f "\$WRAPPER_PROPS" ]; then
            cat > "\$WRAPPER_PROPS" <<EOF
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=\${GRADLE_DIST_URL}
          networkTimeout=10000
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          fi
          exec java -classpath "\$WRAPPER_JAR" org.gradle.wrapper.GradleWrapperMain "\$@"
          GRADLEW_EOF
            chmod +x gradlew
            echo "✓ gradlew script auto-created"
          else
            echo "✓ gradlew script already exists"
          fi
          ls -la gradlew

      - name: Generate Gradle wrapper jar (if missing)
        working-directory: android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing, downloading from gradle/gradle GitHub…"
            mkdir -p gradle/wrapper
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Write local.properties (SDK path)
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cat local.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK (capture full log)
        working-directory: android
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee gradle-build.log
          exit_code=${PIPESTATUS[0]}
          echo "Gradle exit code: $exit_code"
          exit $exit_code

      - name: Save build log on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mytracker-debug-build-log
          path: android/gradle-build.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mytracker-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 30

  build-release:
    name: Build Release APK (unsigned)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Verify app/build.gradle uses subproject references
        working-directory: android
        run: |
          if grep -E "implementation\s+'com\.getcapacitor:" app/build.gradle; then
            echo "❌ ERROR: app/build.gradle masih memakai Maven coordinates."
            exit 1
          fi

      - name: Sync web assets
        run: npx cap sync android

      - name: Ensure gradlew script exists
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            cat > gradlew << 'GRADLEW_EOF'
          #!/usr/bin/env bash
          set -e
          APP_HOME=$(cd "$(dirname "$0")" && pwd)
          WRAPPER_JAR="$APP_HOME/gradle/wrapper/gradle-wrapper.jar"
          WRAPPER_PROPS="$APP_HOME/gradle/wrapper/gradle-wrapper.properties"
          GRADLE_VERSION="8.7"
          if [ ! -f "$WRAPPER_JAR" ]; then
            mkdir -p "$APP_HOME/gradle/wrapper"
            curl -fsSL -o "$WRAPPER_JAR" "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradle/wrapper/gradle-wrapper.jar"
          fi
          if [ ! -f "$WRAPPER_PROPS" ]; then
            cat > "$WRAPPER_PROPS" <<EOF
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
          networkTimeout=10000
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          fi
          exec java -classpath "$WRAPPER_JAR" org.gradle.wrapper.GradleWrapperMain "$@"
          GRADLEW_EOF
            chmod +x gradlew
          fi

      - name: Generate Gradle wrapper jar (if missing)
        working-directory: android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p gradle/wrapper
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Write local.properties (SDK path)
        working-directory: android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK (capture full log)
        working-directory: android
        run: |
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace --info 2>&1 | tee gradle-build-release.log
          exit_code=${PIPESTATUS[0]}
          exit $exit_code

      - name: Save release build log on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mytracker-release-build-log
          path: android/gradle-build-release.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload release APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mytracker-release-apk-unsigned
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 60
