function navStep(){if(!S.dest||!pos)return;const P=[pos.lat,pos.lon],d=hav(P,[S.dest.lat,S.dest.lon]);
if(d<30){alarm('Anda telah tiba di '+S.dest.name);speak('Anda telah tiba di tujuan');S.dest=null;S.route=null;nav=null;return}
if(!S.route&&Date.now()-(S.rtry||0)>20000)getRoute();
let rem=d,ins='Menuju '+S.dest.name,dn=d;const R=S.route;
if(R){let j=R.ri,best=1e12;for(let i=Math.max(0,j-5);i<Math.min(R.pts.length,j+80);i++){const x=hav(P,[R.pts[i][1],R.pts[i][0]]);if(x<best){best=x;j=i}}R.ri=j;
if(best>60&&Date.now()-R.t>20000){R.t=Date.now();getRoute()}
rem=R.cum[R.cum.length-1]-R.cum[j]+best;while(R.si+1<R.steps.length&&hav(P,[R.steps[R.si+1].m[1],R.steps[R.si+1].m[0]])<25)R.si++;
const nx=R.steps[R.si+1];if(nx){dn=hav(P,[nx.m[1],nx.m[0]]);ins=nx.txt;if(dn<180&&R.said!==R.si){R.said=R.si;speak('Dalam '+Math.round(dn/10)*10+' meter, '+ins)}}else{dn=rem;ins='Menuju tujuan'}}
nav={rem,dn,ins,eta:rem/(dsp>2?dsp:(R?R.dist/R.dur:8))}}
function drvStep(){if(!drv||!pos||!S.cal)return;dsp=pos.spd!=null&&!isNaN(pos.spd)?pos.spd:0;if(dsp>1.2&&pos.hdg!=null&&!isNaN(pos.hdg)){dh=pos.hdg;heading=dh}
if(Date.now()-drvT>6000){const p=S.cal.fwd(pos.lat,pos.lon),q=S.cal.fwd(pos.lat+100/110540,pos.lon),ppm=Math.hypot(p[0]-q[0],p[1]-q[1])/100,wm=250+dsp*3.6*8,k=Math.min(15,Math.max(.03,W/(wm*ppm)));
zoom(1+(k/v.k-1)*.3);if(dh!=null){let da=-dh*Math.PI/180-v.r;da=Math.atan2(Math.sin(da),Math.cos(da));rotAbout(da*.5,W/2,H/2)}const s=w2s(p);v.x+=W/2-s[0];v.y+=H*.62-s[1]}
navStep();drvUI()}
function drvUI(){if(!drv)return;const u=spdU();$('#dsp').textContent=Math.round(dsp*u[1]);$('#dsu').textContent=u[0];
$('#dins').textContent=nav?nav.ins:(S.dest?'Mencari rute…':'Mode mengemudi · pilih tujuan (ikon bendera)');
$('#dinf').textContent=nav?fmtD(nav.dn)+' lagi · sisa '+fmtD(nav.rem)+' · tiba '+new Date(Date.now()+nav.eta*1000).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):(pos?'GPS ±'+fmtD(pos.acc):'Menunggu GPS…')}
async function drvOn(){if(!S.cal)return toast('Buka peta yang sudah terkalibrasi dulu (GeoTIFF, GeoPDF, atau peta vektor)');if(watch==null)gps();drv=true;follow=false;$('#bdr').classList.add('on');$('#drv').hidden=false;try{wl=await navigator.wakeLock.request('screen')}catch(x){}drvT=0;drvUI();toast('Mode mengemudi aktif')}
function drvOff(){drv=false;S.dest=null;S.route=null;nav=null;dh=null;$('#bdr').classList.remove('on');$('#drv').hidden=true;try{wl&&wl.release()}catch(x){}wl=null;rotateTo(0);draw()}
function drvT2(){drv?drvOff():drvOn()}
function navDlg(){dlg(`<h3>NAVIGASI</h3><div style="color:var(--mut);font-size:13px">${S.dest?'Tujuan: '+esc(S.dest.name):'Pilih tujuan. Rute jalan memakai internet (OSRM); tanpa internet dipakai panduan garis lurus.'}</div><label>Ke tag<select id="nt"><option value="">— pilih tag —</option>${S.tags.map((t,i)=>tl(t)?`<option value="${i}">${esc(t.name)}</option>`:'').join('')}</select></label><button class="b" onclick="navTag()">Navigasi ke tag</button><button class="b g" onclick="navCross()">Tujuan = posisi crosshair</button><label>Koordinat / tautan Google Maps<input id="nu" placeholder="-6.2088, 106.8456 atau tautan Google Maps"></label><button class="b g" onclick="navUrl()">Navigasi ke koordinat</button>${S.dest?'<button class="b d" onclick="navStop()">Hentikan navigasi</button>':''}<button class="b g" onclick="closeD()">Tutup</button>`)}
function setDest(la,lo,n){S.dest={lat:la,lon:lo,name:n};S.route=null;S.rtry=0;S.rfail=false;nav=null;closeD();if(!drv)drvOn();draw();toast('Tujuan: '+n)}
function navTag(){const t=S.tags[+$('#nt').value];if(!t)return toast('Pilih tag dulu');const l=tl(t);if(!l)return toast('Tag belum punya koordinat');setDest(l[0],l[1],t.name)}
function navCross(){if(!S.cal)return toast('Buka peta terkalibrasi dulu');const w=s2w(W/2,H/2),l=S.cal.inv(w[0],w[1]);setDest(l[0],l[1],'Titik di peta')}
function navUrl(){const l=parseLL($('#nu').value);if(!l)return toast('Koordinat tidak terbaca. Contoh: -6.2088, 106.8456');setDest(l[0],l[1],l[0].toFixed(5)+', '+l[1].toFixed(5))}
function navStop(){S.dest=null;S.route=null;nav=null;closeD();draw();toast('Navigasi dihentikan')}
/* ===== Peta Saya ===== */
let hTab='peta',HM=[],HV=[];
async function homeLoad(){let m=((await tx('readonly',s=>s.getAll(),'meta').catch(()=>[]))||[]).filter(r=>r.kind!=='layer');
if(!m.length){try{const a=(await tx('readonly',s=>s.getAll())).filter(r=>r.kind!=='layer'&&r.buf);for(const r of a){const mt={name:r.name,time:r.time,opened:r.time,size:r.size,cal:!!r.cal};await tx('readwrite',s=>s.put(mt),'meta');m.push(mt)}}catch(x){}}HM=m}
async function showHome(t){if(t)hTab=t;$('#home').hidden=false;await homeLoad();homeRender()}
function hideHome(){$('#home').hidden=true}
function hSearch(){const e=$('#hsr');e.hidden=!e.hidden;if(!e.hidden)$('#hq').focus();else{$('#hq').value='';homeRender()}}
function homeRender(){document.querySelectorAll('#hn button').forEach(b=>b.classList.toggle('on',b.dataset.t===hTab));$('#hsort').hidden=hTab!=='peta';let h='';
if(hTab==='peta'){const q=($('#hq').value||'').toLowerCase(),o=$('#ho').value,L=HM.filter(m=>m.name.toLowerCase().includes(q));
L.sort((a,b)=>o==='nama'?a.name.localeCompare(b.name):o==='ukuran'?(b.size||0)-(a.size||0):o==='impor'?(b.time||'').localeCompare(a.time||''):(b.opened||'').localeCompare(a.opened||''));HV=L;
h='<div class="hsec">Pustaka</div>'+(L.length?L.map((m,i)=>{const cur=S.img&&S.mapName===m.name;return`<div class="hr" onclick="openMapI(${i})"><div class="th">${m.thumb?`<img src="${m.thumb}" alt="">`:'<svg viewBox="0 0 24 24"><path d="M4 5l5-2v16l-5 2zM9 3l6 2v16l-6-2zM15 5l5-2v16l-5 2z"/></svg>'}</div><div class="tx"><b>${esc(m.name)}</b>${cur?'<small class="on">Pada peta</small>':`<small>${m.vec?'Peta vektor':((m.size||0)/1048576).toFixed(1)+' MB'} · ${m.cal?'terkalibrasi':'belum dikalibrasi'}</small>`}</div><button class="hb" onclick="event.stopPropagation();mapMenu(${i})" aria-label="Menu peta"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button></div>`}).join(''):`<div style="color:var(--mut);padding:24px 0">${HM.length?'Tidak ada peta yang cocok.':'Belum ada peta. Ketuk + untuk menambah PDF, GeoTIFF, SHP, GeoJSON, KML/KMZ, atau GPX.'}</div>`)}
else if(hTab==='lap')h='<div class="hsec">Lapisan</div>'+(S.layers.length?S.layers.map((L,i)=>`<div class="it2" style="margin-bottom:8px"><div><b style="color:${L.color}">${esc(L.name)}</b><small>${L.feats.length} fitur · ${L.show?'tampil':'disembunyikan'}</small></div><div class="ac2"><button onclick="S.layers[${i}].show=!S.layers[${i}].show;draw();homeRender()">${L.show?'Sembunyi':'Tampilkan'}</button><button class="x" onclick="delLayer(${i},this)">Hapus</button></div></div>`).join(''):'<div style="color:var(--mut);padding:8px 0">Belum ada lapisan.</div>')+'<button class="b g" style="width:100%;margin-top:8px" onclick="$(\'#fv\').click()">Impor Shapefile / GeoJSON</button>';
else h='<div class="hsec">Data</div>'+[['tag','Tag',S.tags.length],['track','Track',S.tracks.length],['zona','Geofence',S.fences.length],['peta','Status offline','']].map(([k,n,c])=>`<button class="it" style="width:100%;margin-bottom:8px" onclick="storeDlg('${k}')"><b>${n}${c!==''?' ('+c+')':''}</b></button>`).join('');
$('#hl').innerHTML=h;$('#fab').style.display=hTab==='peta'?'grid':'none'}
function mapMenu(i){const m=HV[i];dlg(`<h3>${esc(m.name)}</h3><button class="b" onclick="openMapI(${i})">Buka</button><button class="b g" onclick="renDlg(${i})">Ganti nama</button><button class="b d" onclick="delDlg(${i})">Hapus dari pustaka</button><button class="b g" onclick="closeD()">Tutup</button>`)}
function renDlg(i){dlg(`<h3>Ganti nama peta</h3><input id="rn" value="${esc(HV[i].name)}"><div class="row"><button class="b" onclick="renMap(${i})">Simpan</button><button class="b g" onclick="mapMenu(${i})">Batal</button></div>`)}
async function renMap(i){const m=HV[i],nn=$('#rn').value.trim();if(!nn||nn===m.name)return closeD();if(HM.some(x=>x.name===nn))return toast('Nama sudah dipakai');
try{const r=await tx('readonly',s=>s.get(m.name));r.name=nn;await tx('readwrite',s=>s.put(r));await tx('readwrite',s=>s.delete(m.name));await tx('readwrite',s=>s.put(Object.assign({},m,{name:nn})),'meta');await tx('readwrite',s=>s.delete(m.name),'meta');
S.tags.forEach(t=>{if(t.map===m.name)t.map=nn});if(S.mapName===m.name){S.mapName=nn;$('#mt').textContent=nn}try{if(localStorage.getItem('lastMap')===m.name)localStorage.setItem('lastMap',nn)}catch(x){}persist()}catch(x){toast('Gagal mengganti nama')}closeD();showHome()}
function delDlg(i){dlg(`<h3>Hapus peta?</h3><div style="color:var(--mut);font-size:13px">"${esc(HV[i].name)}" akan dihapus dari HP. Tag dan track Anda tetap tersimpan.</div><div class="row"><button class="b d" onclick="delMapN(${i})">Hapus</button><button class="b g" onclick="closeD()">Batal</button></div>`)}
async function delMapN(i){const m=HV[i];try{await tx('readwrite',s=>s.delete(m.name));await tx('readwrite',s=>s.delete(m.name),'meta')}catch(x){}
if(S.mapName===m.name){S.img=null;S.cal=null;S.calPts=null;S.mapBuf=null;S.mapName=null;$('#mt').textContent='MyTracker';$('#cross').style.display='none';draw()}
try{if(localStorage.getItem('lastMap')===m.name)localStorage.removeItem('lastMap')}catch(x){}closeD();toast('Peta dihapus');showHome()}
async function openMapI(i){const m=HV[i];closeD();const r=await tx('readonly',s=>s.get(m.name));if(!r)return toast('Berkas peta tidak ditemukan');
if(r.vec?await openVector(r.name,r.feats,false):await openAny(r.buf,r.name,r.cal)){tx('readwrite',s=>{const q=s.get(r.name);q.onsuccess=()=>{if(q.result){q.result.opened=new Date().toISOString();s.put(q.result)}};return q},'meta').catch(()=>{});hideHome();try{localStorage.setItem('lastMap',r.name)}catch(x){}}}
function thumbOf(){try{const c=S.img,k=Math.min(1,120/Math.max(c.width,c.height)),t=document.createElement('canvas');t.width=Math.max(1,Math.round(c.width*k));t.height=Math.max(1,Math.round(c.height*k));const x=t.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,t.width,t.height);x.drawImage(c,0,0,t.width,t.height);return t.toDataURL('image/jpeg',.7)}catch(e){return''}}
async function saveMap(){if(!S.mapBuf)return;try{const old=await tx('readonly',s=>s.get(S.mapName)),now=new Date().toISOString(),time=old?old.time:now;
await tx('readwrite',s=>s.put({name:S.mapName,buf:S.mapBuf,cal:S.calPts,time,size:S.mapBuf.byteLength}));await tx('readwrite',s=>s.put({name:S.mapName,time,opened:now,size:S.mapBuf.byteLength,cal:!!S.calPts,thumb:thumbOf()}),'meta');
try{localStorage.setItem('lastMap',S.mapName)}catch(x){}}catch(x){toast('Gagal menyimpan peta ke penyimpanan HP')}}
const NAT=()=>!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
if(NAT()){const P=Capacitor.Plugins;try{P.StatusBar.setBackgroundColor({color:'#060b14'});P.StatusBar.setStyle({style:'DARK'})}catch(x){}
try{P.App.addListener('backButton',()=>{if(!$('#modal').hidden)closeD();else if(!$('#home').hidden)P.App.exitApp();else showHome()})}catch(x){}}
setTimeout(()=>{const sp=$('#splash');if(sp){sp.classList.add('x');setTimeout(()=>sp.remove(),600)}},1800);showHome();
